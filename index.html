<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride Finder — find your running shoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEDF4; --ink:#1B1832; --muted:#5C5975;
  --line:#D9D9E6; --track:#5B3FA0; --track-deep:#3E2A75; --on-track:#FFFFFF;
  --grass:#2C7A50; --bib:#FFD23F; --bib-ink:#1B1832; --warn:#B4481F; --warn-bg:#FBEDE6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13111D; --surface:#1D1A2B; --surface-2:#262238; --ink:#EEEDF6; --muted:#A7A3BC;
    --line:#35304B; --track:#7A5ED2; --track-deep:#4B3592; --on-track:#FFFFFF;
    --grass:#4DB57D; --bib:#FFD23F; --bib-ink:#1B1832; --warn:#F2915F; --warn-bg:#3A231C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13111D; --surface:#1D1A2B; --surface-2:#262238; --ink:#EEEDF6; --muted:#A7A3BC;
  --line:#35304B; --track:#7A5ED2; --track-deep:#4B3592; --on-track:#FFFFFF;
  --grass:#4DB57D; --bib:#FFD23F; --bib-ink:#1B1832; --warn:#F2915F; --warn-bg:#3A231C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bib);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}

/* ---------- header + track progress ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;letter-spacing:.01em;font-style:italic;color:var(--track)}
.split{color:var(--muted);font-size:15px}
.track{position:relative;height:64px;border-radius:14px;background:var(--track);overflow:hidden;
  background-image:
    linear-gradient(var(--track),var(--track)),
    repeating-linear-gradient(180deg,transparent 0 20px,rgba(255,255,255,.55) 20px 21.5px);
  background-blend-mode:normal;}
.track::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 20px,rgba(255,255,255,.5) 20px 21.5px);}
.track .start{position:absolute;left:18px;top:0;bottom:0;width:3px;background:#fff}
.track .finish{position:absolute;right:0;top:0;bottom:0;width:18px;
  background:conic-gradient(#fff 25%,#1B1832 0 50%,#fff 0 75%,#1B1832 0) 0 0/9px 9px}
.track .tick{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(255,255,255,.35)}
.track .tick.done{border-left-style:solid;border-left-color:rgba(255,210,63,.75)}
.runner{position:absolute;top:50%;width:46px;height:46px;margin-left:-23px;transform:translateY(-50%);
  transition:left .6s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:reduce){.runner{transition:none}}

/* ---------- question ---------- */
.q{margin-top:26px}
.q h1{font-size:clamp(32px,6vw,46px);line-height:1.02;font-weight:700;margin:0 0 8px;letter-spacing:-.005em;max-width:20ch}
.q .sub{color:var(--muted);margin:0 0 22px;max-width:58ch}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.grid.three{grid-template-columns:repeat(3,1fr);gap:8px}}
.opt{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--track)}
.opt .t{display:block;font-weight:600;font-size:17px}
.opt .d{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;line-height:1.35}
.opt[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:var(--on-track)}
.opt[aria-pressed="true"] .d{color:rgba(255,255,255,.82)}
.opt.check{padding-left:46px}
.opt.check::before{content:"";position:absolute;left:14px;top:16px;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);background:var(--surface)}
.opt.check[aria-pressed="true"]::before{background:var(--bib);border-color:var(--bib)}
.opt.check[aria-pressed="true"]::after{content:"";position:absolute;left:21px;top:19px;width:6px;height:11px;border:solid var(--bib-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt.fig{text-align:center;padding:14px 8px 12px}
.opt.fig svg{display:block;margin:0 auto 8px;height:110px;width:auto}
.opt.fig .print{fill:var(--ink);opacity:.82}
.opt.fig[aria-pressed="true"] .print{fill:#fff;opacity:1}

/* sliders + inputs */
.field{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.field label,.field .lab{display:block;font-weight:600;margin-bottom:6px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--track)}
.big small{font-size:20px;color:var(--muted);font-weight:600;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--track);height:28px;margin:10px 0 2px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.inline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.txt{font:inherit;font-size:22px;font-family:"Barlow Condensed",sans-serif;font-weight:600;width:120px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.txt:focus{border-color:var(--track);outline:none}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--track);color:var(--on-track)}
.hint{color:var(--muted);font-size:14.5px;margin-top:8px}
.skip{background:none;border:0;color:var(--track);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--warn);font-size:15px;margin-top:8px}

/* maps */
.maps{display:grid;gap:12px;grid-template-columns:1fr 1.25fr}
@media (max-width:600px){.maps{grid-template-columns:1fr}}
.map{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px}
.map .cap{font-weight:600;font-size:15px;margin:2px 4px 6px;color:var(--muted)}
.map .stage{position:relative}
.map svg{display:block;width:100%;height:auto}
.map .body-fill{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.hot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2.5px solid var(--track);background:color-mix(in srgb,var(--surface) 70%,transparent);cursor:pointer;padding:0}
.hot::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--track);opacity:.35}
.hot[aria-pressed="true"]{border-color:var(--warn);background:var(--warn)}
.hot[aria-pressed="true"]::after{background:#fff;opacity:.95;inset:11px}
.hot .tip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s}
.hot:hover .tip,.hot:focus-visible .tip{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:600;background:var(--warn-bg);color:var(--warn);border:0;cursor:pointer}
.chip.plain{background:var(--surface-2);color:var(--ink);cursor:default}
.sole-zone{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.sole-zone.on{fill:var(--warn);opacity:.85}
.solewrap{max-width:300px;margin:0 auto}
.zone-lab{font-family:"Barlow Condensed",sans-serif;font-size:13px;fill:var(--muted);font-weight:600}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:600;font-size:17px;cursor:pointer}
.btn.go{background:var(--track);color:var(--on-track)}
.btn.go:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.bib{background:var(--bib);color:var(--bib-ink)}

/* intro */
.hero{margin-top:30px}
.hero h1{font-size:clamp(46px,10vw,86px);line-height:.92;font-weight:800;font-style:italic;margin:0 0 14px;letter-spacing:-.01em;color:var(--ink)}
.hero p{max-width:54ch;color:var(--muted);margin:0 0 10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:18px;margin:22px 0 26px}
.hero .meta div{font-size:15px;color:var(--muted)}
.hero .meta b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:34px;line-height:1;color:var(--track)}

/* results */
.tape{position:relative;height:30px;margin:28px 0 8px;overflow:hidden}
.tape span{position:absolute;top:12px;height:7px;width:50%;background:var(--bib)}
.tape span:first-child{left:0;transform-origin:left center;animation:tl 1s .25s cubic-bezier(.2,.7,.2,1) forwards}
.tape span:last-child{right:0;transform-origin:right center;animation:tr 1s .25s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tl{to{transform:translateX(-8%) rotate(-9deg) scaleX(.9)}}
@keyframes tr{to{transform:translateX(8%) rotate(9deg) scaleX(.9)}}
@media (prefers-reduced-motion:reduce){.tape span{animation:none!important}}
.res-h{font-size:clamp(34px,7vw,52px);line-height:1;font-weight:800;font-style:italic;margin:6px 0 6px}
.res-sub{color:var(--muted);margin:0 0 20px}
.bibcard{background:var(--surface);border-radius:18px;border:2px solid var(--line);overflow:hidden}
.bibtop{display:flex;gap:16px;align-items:stretch;padding:18px;background:var(--track);color:var(--on-track)}
.bibnum{flex:0 0 auto;background:var(--bib);color:var(--bib-ink);border-radius:10px;padding:8px 12px;text-align:center;min-width:96px;position:relative}
.bibnum::before,.bibnum::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:var(--track)}
.bibnum::before{left:7px}.bibnum::after{right:7px}
.bibnum b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:50px;line-height:1;font-weight:800;margin-top:6px}
.bibnum span{font-size:13px;font-weight:600}
.bibname .brand{font-size:16px;opacity:.85;font-weight:600}
.bibname h2{font-size:clamp(32px,6vw,44px);line-height:1;margin:2px 0 6px;font-weight:800}
.bibname .price{font-size:16px;opacity:.9}
.bibbody{padding:18px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.spec{background:var(--surface-2);border-radius:10px;padding:9px 12px}
.spec .k{font-size:13px;color:var(--muted)}
.spec .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1.1}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--track)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:22px;margin:0 0 8px;font-weight:700}
.cols ul{margin:0;padding-left:20px}
.cols li{margin-bottom:6px}
.heads li::marker{color:var(--warn)}
.why li::marker{color:var(--grass)}
.heads .rel{color:var(--warn);font-weight:600}
.alts{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:14px}
@media (max-width:620px){.alts{grid-template-columns:1fr}}
.alt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.alt .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.alt h3{font-size:26px;margin:0;line-height:1.05;font-weight:700}
.alt .pct{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:28px;color:var(--track)}
.alt .brand{color:var(--muted);font-size:14.5px}
.alt ul{margin:8px 0 0;padding-left:18px;font-size:15.5px}
.alt .con{color:var(--warn)}
.section-h{font-size:28px;font-weight:700;margin:34px 0 4px}
.section-p{color:var(--muted);margin:0 0 6px;max-width:60ch}
.blocked{background:var(--warn-bg);border-radius:14px;padding:14px 16px;margin-top:10px}
.blocked b{font-family:"Barlow Condensed",sans-serif;font-size:22px}
.blocked p{margin:4px 0 0}
.profile{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.profile button{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14.5px;cursor:pointer}
.profile button:hover{border-color:var(--track)}
table.rank{width:100%;border-collapse:collapse;font-size:15.5px}
.rank-wrap{overflow-x:auto;margin-top:10px;background:var(--surface);border-radius:12px;border:2px solid var(--line)}
table.rank th,table.rank td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank th{font-weight:600;color:var(--muted);font-size:14px}
table.rank td.p{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;color:var(--track)}
.foot{margin-top:36px;color:var(--muted);font-size:14px;max-width:66ch}
.foot p{margin:0 0 8px}
.note{background:var(--surface);border-left:4px solid var(--grass);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.shoe-art{display:block;width:100%;height:auto}
.art-wrap{background:var(--surface-2);border-radius:12px;padding:10px 12px 4px;margin-bottom:14px}
.art-cap{font-size:13px;color:var(--muted);margin:2px 2px 0}
.alt .art-wrap{margin:10px 0 6px;padding:6px 8px 2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-top:12px}
.gcard{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.gcard.podium{border-color:var(--track)}
.gcard .art-wrap{margin-bottom:8px;padding:4px 6px 0}
.gcard .gp{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--track)}
.gcard .gn{font-weight:600;line-height:1.2;margin-top:2px}
.gcard .gm{color:var(--muted);font-size:13.5px}
.find{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:600;color:var(--track);text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Stride Finder</div>
    <div class="split" id="split"></div>
  </div>
  <div class="track" id="track" aria-hidden="true"></div>
  <main id="app" aria-live="polite"></main>
</div>

<script>

  exp:{new:"New runner",casual:"Regular runner",experienced:"Experienced",competitive:"Competitive"},
  goals:{fitness:"Fitness",firstRace:"First race",pr:"Half/marathon PR",speed:"5K/10K speed",ultra:"Trails & ultras",recovery:"Easy & recovery miles",walking:"Walk + run"},
  terrain:{road:"Road",treadmill:"Treadmill",track:"Track",trailLight:"Groomed trail",trailTech:"Technical trail"},
  width:{narrow:"Narrow feet",standard:"Standard width",wide:"Wide feet"},
  arch:{flat:"Flat arch",medium:"Medium arch",high:"High arch"},
  wear:{inF:"Inner forefoot wear",outF:"Outer forefoot wear",inH:"Inner heel wear",outH:"Outer heel wear",even:"Even wear",none:"No old pair"},
  pain:{back:"Lower back",hips:"Hips",knees:"Knees",shins:"Shins",ankles:"Ankles roll",achilles:"Achilles",heel:"Heel / plantar fascia",arch:"Arch",ball:"Ball of foot",toes:"Toes",bunion:"Big-toe joint / bunion",none:"No pain"},
  strike:{heel:"Heel striker",mid:"Midfoot striker",fore:"Forefoot striker",unsure:"Strike unknown"},
  ride:{bouncy:"Bouncy ride",planted:"Planted ride",any:"Any ride"},
  drop:{low:"Low drop",mid:"Mid drop",high:"Traditional drop",any:"Any drop"},

};

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has = (k,v) => S[k].includes(v);
const opt = (key,val,title,desc,multi) => { const isList=Array.isArray(S[key]); return `<button class="opt${multi?" check":""}" data-act="${isList?"toggle":"pick"}" data-key="${key}" data-val="${val}" aria-pressed="${isList?has(key,val):S[key]===val}"><span class="t">${title}</span>${desc?`<span class="d">${desc}</span>`:""}</button>`; };

/* --- figure helpers --- */
function footprintSVG(sx){
  return `<svg viewBox="0 0 80 150" aria-hidden="true"><g class="print" transform="translate(40 0) scale(${sx} 1) translate(-40 0)">
  <ellipse cx="40" cy="58" rx="22" ry="27"/><ellipse cx="41" cy="118" rx="15" ry="22"/><rect x="25" y="62" width="31" height="56" rx="12"/>
  <circle cx="27" cy="22" r="7.5"/><circle cx="40" cy="17" r="5.5"/><circle cx="50" cy="19" r="5"/><circle cx="58" cy="25" r="4.5"/><circle cx="64" cy="33" r="4"/></g></svg>`;
}
function archSVG(type){
  const mid = type==="flat" ? `<rect x="19" y="62" width="40" height="56" rx="10"/>`
            : type==="medium" ? `<path d="M40 70 Q30 92 42 112 L56 112 L56 70 Z"/><rect x="40" y="66" width="17" height="50" rx="8"/>`
            : `<rect x="50" y="72" width="7" height="40" rx="3.5"/>`;
  return `<svg viewBox="0 0 80 150" aria-hidden="true"><g class="print">
  <ellipse cx="40" cy="56" rx="21" ry="21"/><ellipse cx="41" cy="122" rx="15" ry="18"/>${mid}
  <circle cx="27" cy="24" r="7.5"/><circle cx="40" cy="19" r="5.5"/><circle cx="50" cy="21" r="5"/><circle cx="58" cy="27" r="4.5"/><circle cx="64" cy="35" r="4"/></g></svg>`;
}
const hot = (key,val,x,y,label) => `<button class="hot" style="left:${x}%;top:${y}%" data-act="toggle" data-key="${key}" data-val="${val}" aria-pressed="${has(key,val)}" aria-label="${label}"><span class="tip">${label}</span></button>`;

/* =========================================================
   PROFILE + SCORING
   ========================================================= */
function paceToMile(){
  const m = /^(\d{1,2})[:.](\d{2})$/.exec(S.pace.trim()); if(!m) return null;
  const v = +m[1] + +m[2]/60; return S.paceUnit==="km" ? v*1.609 : v;
}
function profile(){
  const w=parseFloat(S.weight); const lbs = S.noWeight||!w ? null : (S.unit==="kg"? w*2.2046 : w);
  const pain = new Set(S.pain.filter(p=>p!=="none"));
  const wear = new Set(S.wear);
  let sup=0, supWhy=[];
  if(S.arch==="flat"){sup+=1.5;supWhy.push("flatter arch");}
  if(wear.has("inF")||wear.has("inH")){sup+=1.5;supWhy.push("inner-edge wear");}
  if(pain.has("ankles")) sup+=.5;
  if(pain.has("arch")) sup+=.5;
  if(pain.has("knees")&&sup>0) sup+=.3;
  if((wear.has("outF"))&&!(wear.has("inF")||wear.has("inH"))) sup=Math.min(sup,.5);
  sup=Math.max(0,Math.min(3,Math.round(sup)));
  let cush=3;
  if(lbs>=200) cush+=1; if(lbs>=235) cush+=.5;
  if(S.miles>=30) cush+=.5; if(S.miles>=50) cush+=.5;
  if(["knees","back","hips","heel","ball","shins"].some(p=>pain.has(p))) cush+=1;
  if(S.goals.includes("recovery")) cush+=.5; if(S.goals.includes("walking")) cush+=.5; if(S.goals.includes("pr")) cush+=.5;
  if(S.arch==="high") cush+=.5;
  if(wear.has("outF")) cush+=.5;
  cush += (3-S.firm)*.6;
  cush=Math.max(1,Math.min(5,cush));
  const g=new Set(S.goals), t=new Set(S.terrain);
  return {lbs,pain,wear,sup,supWhy,cush,g,t,
    road:t.has("road")||t.has("treadmill")||t.has("track"), lt:t.has("trailLight"), tt:t.has("trailTech"),
    speed:g.has("speed")||g.has("pr")||S.exp==="competitive", pace:paceToMile(), peeves:new Set(S.peeves)};
}

function scoreShoe(s,p){
  let sc=72, rp=0; const why=[], heads=[];
  const add=(n,txt)=>{ sc+=n; if(txt&&n>0) why.push([n,txt]); };
  const rev=(n,txt)=>{ sc-=n; rp+=n; if(txt) heads.push(txt); };
  const f=x=>s.flags.includes(x);
  const isTrail=s.terrain==="trail", both=s.terrain==="both";

  // terrain
  if(isTrail){
    if(!p.lt&&!p.tt) add(-40);
    else { add(p.tt?10:6,"Trail grip and protection for the dirt you run on");
      if(p.tt) add((s.tech-3)*4, s.tech>=5?"Aggressive lugs for rocky, rooty or muddy ground":"");
      if(p.road) add(-6);
      if(p.road&&s.id==="speedcross6") rev(8,"Reviewers find its deep lugs awkward and unstable on pavement and hardpack"); }
  } else if(both){
    if(p.lt||p.tt) add(p.road?11:4,"Hybrid build that links road miles with trail sections");
    if(p.tt) add(-8);
    if(!p.lt&&!p.tt) add(-7);
  } else {
    if(p.tt&&!p.road) add(-42); else if(p.tt) add(-14); else if(p.lt&&!p.road) add(-18); else if(p.lt) add(-3);
  }

  // category vs goals
  if(s.cat==="race"){
    if(!p.speed) add(-30); else { add(7,"Carbon-plated race-day shoe for the PR you’re chasing"); if(p.pace&&p.pace>9.5) rev(8,"Testers find super shoes unstable and less rewarding at relaxed paces"); }
    if(S.exp==="new") add(-14); if(S.miles>=40) add(-4);
  }
  if(s.cat==="super"||s.cat==="tempo"){
    if(p.speed) add(6, s.cat==="tempo"?"Plated tempo shoe for faster sessions":"High-cushion super trainer for long runs and workouts");
    if(S.exp==="new") add(-6);
  }
  if(s.cat==="max"&&p.cush>=4) add(5,"Max cushioning to soften every landing");
  if(s.cat==="value"){ if(S.budget<=130) add(8,"Strong value at its price"); if(S.exp==="new") add(4,"A forgiving, affordable first pair"); }
  if(s.cat==="daily"){ add(2); if(p.g.has("fitness")||p.g.has("firstRace")) add(4,"Versatile daily trainer for building consistent miles"); }

  // support
  add(-Math.abs(s.support-p.sup)*7);
  if(p.sup>=2&&s.support>=2) add(8,`Stability features for your ${p.supWhy.join(" and ")||"foot type"}`);
  if(p.sup===1&&s.support===1) add(4,"Mild guidance without feeling corrective");
  if(p.sup===0&&s.support>=2) add(-3);
  if(p.sup>=2&&s.support===0&&f("unstable")) rev(6,"Soft, tall and neutral — reviewers call it wobbly, which matters with your foot type");

  // cushion
  add(-Math.abs(s.cush-p.cush)*5);
  if(s.cush>=4&&p.cush>=4) add(5,"Deep cushioning to match your mileage and comfort needs");
  if(s.cush<=3&&S.firm>=4) add(4,"The firmer, connected feel you asked for");

  // energy
  if(S.ride==="bouncy"&&s.bounce>=4) add(5,"Springy, high-energy foam");
  if(S.ride==="planted"){ if(f("unstable")) rev(7,"Testers describe the soft, tall platform as less stable"); if(s.support>=1||s.bounce<=2) add(4,"Planted, predictable ride"); }

  // body weight
  if(p.lbs){
    if(p.lbs>=200){ add((s.heavy-3)*5, s.heavy>=5?"Wide, durable platform that suits heavier runners":"");
      if(f("unstable")) rev(5,"Light, high-stack builds tend to feel less stable under more body weight");
      if(s.cat==="race") add(-6); }
    if(p.lbs>=235) add((s.heavy-3)*3);
    if(p.lbs<140&&s.wt>=11) add(-4);
    if(p.lbs<150&&s.wt<=8.5&&s.cat!=="race") add(3,"Light enough not to feel clunky");
  }

  // durability
  const dw=1+(S.miles>=25?1:0)+(p.lbs>=200?1:0)+(p.peeves.has("dur")?2:0);
  const dd=(s.dur-3)*2.5*dw;
  if(dd>0) add(dd, s.dur>=4&&dw>=2?"Rated durable in lab wear tests and owner reviews — good for your mileage":"");
  else if(dd<0){
    const parts=[]; if(f("outsole")) parts.push("outsole wearing or peeling early"); if(f("upper")) parts.push("uppers breaking down");
    rev(-dd, s.dur<=2?`Durability complaints in reviews: ${parts.join(" and ")||"short lifespan"}`:"");
  }

  // width & toes
  if(S.width==="wide"){
    if(s.fit==="roomy") add(8,"Roomy fit for wide feet"+(s.wide?", with extra-wide sizes too":""));
    else if(s.fit==="narrow") rev(s.wide?7:12, s.wide?"Runs narrow — some wide-footed reviewers still found the wide version snug":"Runs narrow and has no wide version");
    else if(s.wide) add(3,"Available in wide sizes"); else add(-4);
  }
  if(S.width==="narrow"){ if(s.fit==="narrow") add(6,"Snug, locked-in fit for narrower feet"); if(s.fit==="roomy") add(-6); }
  if(p.pain.has("toes")||p.pain.has("bunion")||p.peeves.has("toe")){
    if(s.fit==="roomy") add(6,"Roomy toe box takes pressure off your toes");
    if(f("narrowToe")) rev(8,"Reviewers call out a tapered, cramped toe box");
  }

  // drop
  if(p.pain.has("achilles")){
    if(s.drop>=8) add(5,"Higher heel drop eases strain on the Achilles and calves");
    else if(s.drop<=4) rev(s.drop===0?14:8, s.drop===0?"Zero drop loads the Achilles and calves — a poor match for Achilles pain":"Low drop puts extra load on the Achilles");
  }
  if(S.drop==="low"){ if(s.drop<=5) add(6,"Low heel-to-toe drop, as you prefer"); else if(s.drop>=10) add(-6); }
  if(S.drop==="mid"&&s.drop>=6&&s.drop<=9) add(4,"Mid-range drop, as you prefer");
  if(S.drop==="high"){ if(s.drop>=10) add(6,"Traditional 10–12 mm drop, as you prefer"); else if(s.drop<=5) add(-8); }
  if(f("zero")&&S.drop!=="low"&&(S.exp==="new"||S.strike==="heel")) rev(7,"Zero drop needs a slow transition; reviewers mention calf and Achilles soreness when switching");
  if(S.strike==="fore"&&s.drop<=6) add(3);
  if(S.strike==="heel"&&s.drop>=8) add(3,"Heel-friendly geometry for your heel strike");

  // pain
  const jp=["knees","shins","hips","back"].filter(x=>p.pain.has(x));
  if(jp.length&&s.cush>=4) add(4,`Extra shock absorption for your ${jp.map(x=>LABELS.pain[x].toLowerCase()).join(", ")}`);
  if(p.pain.has("heel")){ if(s.cush>=4) add(3); if(s.rocker) add(3,"Rocker shape reduces load on the heel and plantar fascia"); if(s.drop<=4) add(-4); }
  if(p.pain.has("arch")&&s.support>=1) add(3,"Arch support for your arch pain");
  if(p.pain.has("ball")&&s.rocker) add(5,"Rocker forefoot unloads the ball of the foot");
  if(p.pain.has("ankles")){ if(s.support>=1) add(4,"Stable base for ankles that tend to roll"); if(f("unstable")) rev(8,"Reviewers find it wobbly — a concern when your ankles roll"); }

  // review-driven pet peeves
  if(p.peeves.has("pebbles")&&f("pebbles")) rev(15,"Many owners report pebbles wedging into the open sole channels");
  if(p.peeves.has("wet")&&f("wetgrip")) rev(12,"Grip on wet surfaces is a recurring complaint");
  if(p.peeves.has("wet")&&s.id==="velocity4") add(4,"Grippy outsole praised on slick roads");
  if(p.peeves.has("hot")&&f("hot")) rev(6,"The upper runs warm, according to reviewers");
  if(p.peeves.has("heavy")){ if(s.wt>=10.5) rev(6,`On the heavier side at about ${s.wt} oz`); if(s.wt<=8.5) add(4,"Light on the foot"); }
  if(p.peeves.has("wobbly")&&f("unstable")) rev(10,"A tall, soft platform that testers describe as wobbly");
  if(p.peeves.has("heelslip")&&f("heelslip")) rev(9,"A tester reported the heel never felt fully locked in");

  // goals extras
  if(p.g.has("walking")){ if(["race","super","tempo"].includes(s.cat)) add(-10); else if(s.cush>=4) add(3,"Comfortable for walking as well as running"); }
  if(p.g.has("ultra")&&isTrail&&s.cush>=4) add(6,"Cushioned enough for long hours on trail");
  if(p.g.has("recovery")&&s.cush>=4&&s.cat!=="race") add(4,"Plush enough for recovery days");
  if(p.g.has("speed")&&(s.bounce>=5)) add(4,"Responsive enough for faster sessions");
  if(p.g.has("speed")&&s.cat==="max"&&s.wt>=10.5) add(-4);
  if(S.exp==="new"&&["daily","value","stab"].includes(s.cat)) add(3);

  // budget
  const over=s.price-S.budget;
  if(over>0&&S.budget<275) add(-Math.min(35,over*.6));
  else if(S.budget-s.price>=20) add(2);

  return {s,raw:sc,pre:sc+rp,rp,why:why.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4),heads:[...new Set(heads)]};
}

function rankAll(){
  const p=profile();
  const all=SHOES.map(s=>scoreShoe(s,p)).sort((a,b)=>b.raw-a.raw);
  const top=all[0].raw;
  all.forEach(r=>{ r.pct = Math.max(20,Math.round(Math.min(98,top>0?top:98) * (r.raw>0?r.raw:1)/ (top||1))); });
  all[0].pct=Math.min(98,Math.max(60,Math.round(top)));
  all.forEach((r,i)=>{ if(i>0) r.pct=Math.min(all[0].pct-1, Math.max(20,Math.round(all[0].pct*r.raw/top))); });
  return {p,all};
}

function drawTrack(){
  const n=STEPS.length; const pos = step<0?0: step>=n?100:(step/n)*100;
  let ticks="";
  for(let i=1;i<n;i++){ const x=18+(i/n)*(100-0); ticks+=`<span class="tick${i<=step?" done":""}" style="left:calc(18px + (100% - 36px) * ${i/n})"></span>`; }
  if(!trackEl.dataset.built){ trackEl.innerHTML=`<span class="start"></span><span class="finish"></span><span id="ticks"></span>${runnerSVG}`; trackEl.dataset.built=1; }
  document.getElementById("ticks").innerHTML=ticks;
  document.getElementById("runner").style.left=`calc(18px + (100% - 36px - 18px) * ${pos/100} + ${pos>=100?18:0}px)`;
  splitEl.textContent = step<0 ? `${n} questions` : step>=n ? "Finished" : `Question ${step+1} of ${n}`;
}

/* ---------- spec-driven shoe illustrations ---------- */
const UPPERS=["#5B3FA0","#2C7A50","#1F6FB2","#C2412D","#46465A","#C98F00","#7A3E8C","#0F7C7C","#B03A62","#3D6B8F"];
const STACK={novablast6:39,superblast3:45,megablast:44,nimbus27:41,kayano33:40,adrenaline25:37,structureplus:42,vaporfly4:40,adiospro4:39,hyperionElite6:40,speedgoat7:33,peregrine16:28,lonepeak9:25,olympus6:33,clifton10:42,bondi9:43,skywardx2:48,vomero18:46,cascadia19:30,speedcross6:30,nb1080v15:38,evosl:39,endorphinspeed5:36,triumph24:40,hurricane26:41,beast26:39,mach7:37,neovista2:45};
const CATNAME={daily:"Daily trainer",max:"Max cushion",stab:"Stability",super:"Super trainer",tempo:"Tempo",race:"Racer",trail:"Trail",value:"Budget"};
const heelStack=s=>STACK[s.id]||(s.terrain==="trail"?24+s.cush*2.6:27+s.cush*3);
const hashId=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return h;};
function shoeSVG(s){
  const G=104, hs=heelStack(s), fs=Math.max(hs-s.drop,12);
  const h=hs*1.05, f=fs*1.05, topH=G-h, topF=G-f, lift=s.rocker?14:5;
  const up=UPPERS[hashId(s.id)%UPPERS.length];
  const mid=["race","super","tempo"].includes(s.cat)?"#FFE08A":"#F2F0EA";
  const yTop=x=>topH+(topF-topH)*(x-18)/188;
  let lugs=""; if(s.terrain!=="road"){ const L=s.tech>=5?5.5:3.5; for(let x=40;x<200;x+=13) lugs+=`<rect x="${x}" y="${G}" width="7" height="${L}" rx="1.5" fill="#2A2838"/>`; }
  const plate=s.plate!=="none"?`<path d="M40 ${topH+h*0.55} Q140 ${G-7} 222 ${G-lift-5}" fill="none" stroke="${s.plate==="carbon"?"#1B1832":"#8A85A3"}" stroke-width="3" stroke-linecap="round"/>`:"";
  const post=s.support>=2?`<path d="M60 ${yTop(60)+3} L112 ${yTop(112)+3} L112 ${G-3} L60 ${G-3} Z" fill="#9C93C4" opacity="${s.support>=3?.85:.6}"/>`:"";
  let laces=""; for(let x=116;x<=156;x+=9){ const y=25+(x-112)*0.45; laces+=`<path d="M${x} ${y-3} l7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>`; }
  return `<svg class="shoe-art" viewBox="0 0 240 118" role="img" aria-label="Illustration of the ${s.brand} ${s.model}: about ${Math.round(hs)} mm heel stack, ${s.drop} mm drop${s.plate!=="none"?", "+s.plate+" plate":""}${s.support>=2?", stability post":""}${s.terrain!=="road"?", trail lugs":""}">
  <ellipse cx="124" cy="${G+9}" rx="104" ry="4" fill="var(--ink)" opacity=".08"/>
  <path d="M22 ${topH+2} C8 ${topH-30} 14 16 34 12 Q56 8 76 26 Q94 16 110 20 L152 40 Q196 56 214 ${topF-10} Q238 ${topF-2} 206 ${topF+2} L18 ${topH+2} Z" fill="${up}"/>
  <path d="M60 18 Q70 22 76 26" fill="none" stroke="#000" stroke-width="2" opacity=".25"/>
  <path d="M28 ${topH-6} C20 ${topH-30} 24 26 36 20" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>
  <path d="M92 ${yTop(92)-2} Q140 ${yTop(140)-26} 186 ${yTop(186)-6}" fill="none" stroke="#fff" stroke-width="2.5" opacity=".3"/>
  ${laces}
  <path d="M18 ${topH} L206 ${topF} Q230 ${topF+2} 228 ${G-lift} Q200 ${G} 165 ${G} L34 ${G} Q20 ${G} 18 ${G-8} Z" fill="${mid}" stroke="#2A2838" stroke-opacity=".25" stroke-width="1.5"/>
  ${post}${plate}
  <path d="M34 ${G} L165 ${G} Q200 ${G} 228 ${G-lift}" fill="none" stroke="#2A2838" stroke-width="3.5" stroke-linecap="round"/>
  ${lugs}</svg>`;
}
const art=(s,cap)=>`<div class="art-wrap">${shoeSVG(s)}${cap?`<div class="art-cap">Drawn to this shoe’s specs: heel stack, drop and rocker${s.plate!=="none"?", plate (dark line)":""}${s.support>=2?", stability post (shaded)":""}${s.terrain!=="road"?", lugs":""}. Not a product photo.</div>`:""}</div>`;
const find=s=>`<a class="find" href="https://www.google.com/search?q=${encodeURIComponent(s.brand+" "+s.model+" running shoe")}" target="_blank" rel="noopener">See it in stores</a>`;

const meter=n=>`<span class="meter" aria-label="${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
const supTxt=["Neutral","Mild support","Moderate support","Max support"];

function renderResults(){
  const {p,all}=rankAll();
  const [a,b,c]=all;
  const top3=new Set([a,b,c].map(r=>r.s.id));
  // rotation partner
  let partner=null;
  if(p.speed&&a.s.terrain!=="trail"){
    const want = a.s.cat==="race" ? ["super","tempo"] : ["race"];
    partner=all.find(r=>want.includes(r.s.cat)&&!top3.has(r.s.id))
         || all.find(r=>["race","super","tempo"].includes(r.s.cat)&&!top3.has(r.s.id)&&r.s.terrain!=="trail");
  }
  // steered away: would have ranked well but review issues sank them
  const byPre=[...all].sort((x,y)=>y.pre-x.pre).slice(0,12);
  const blocked=byPre.filter(r=>r.rp>=10&&!top3.has(r.s.id)&&r.heads.length).slice(0,2);

  const relCons=r=>{ const h=r.heads.map(t=>`<li class="rel">${t}</li>`); const rest=r.s.cons.slice(0, Math.max(1,3-h.length)).map(t=>`<li>${t}</li>`); return h.concat(rest).join(""); };
  const pc=r=>`${r.pct}%`;

  const chips=[
    [0,LABELS.exp[S.exp]],[1,`${S.miles} mi/week`],...S.goals.map(g=>[2,LABELS.goals[g]]),...S.terrain.map(t=>[3,LABELS.terrain[t]]),
    [4,p.lbs?`${Math.round(p.lbs)} lb`:"Weight skipped"],[5,LABELS.width[S.width]],[6,LABELS.arch[S.arch]],...S.wear.map(w=>[7,LABELS.wear[w]]),
    ...S.pain.map(x=>[8,LABELS.pain[x]]),[9,LABELS.strike[S.strike]],[10,LABELS.ride[S.ride]],[10,LABELS.drop[S.drop]],[11,`Up to $${S.budget}`],...S.peeves.map(x=>[12,"Avoid: "+LABELS.peeves[x]])
  ];

  app.innerHTML=`<section>
   <div class="tape" aria-hidden="true"><span></span><span></span></div>
   <h1 class="res-h" tabindex="-1" id="qh">You crossed the line.</h1>
   <p class="res-sub">Here’s the shoe that fits how you run — and the honest catches runners report.</p>

   <article class="bibcard">
    <div class="bibtop"><div class="bibnum"><span>Match</span><b>${a.pct}</b><span>percent</span></div>
     <div class="bibname"><div class="brand">${a.s.brand}</div><h2>${a.s.model}</h2><div class="price">About $${a.s.price} · ${a.s.terrain==="trail"?"Trail":a.s.terrain==="both"?"Road to trail":"Road"}</div></div></div>
    <div class="bibbody">
     ${art(a.s,true)}
     <div class="specs">
      <div class="spec"><div class="k">Weight</div><div class="v">≈${a.s.wt} oz</div></div>
      <div class="spec"><div class="k">Heel drop</div><div class="v">${a.s.drop} mm</div></div>
      <div class="spec"><div class="k">Cushion</div><div class="v">${meter(a.s.cush)}</div></div>
      <div class="spec"><div class="k">Support</div><div class="v">${supTxt[a.s.support]}</div></div>
      <div class="spec"><div class="k">Durability</div><div class="v">${meter(a.s.dur)}</div></div>
      <div class="spec"><div class="k">Plate</div><div class="v">${a.s.plate==="none"?"None":a.s.plate==="carbon"?"Carbon":"Nylon"}</div></div>
     </div>
     <div class="cols">
      <div><h3>Why it fits you</h3><ul class="why">${(a.why.length?a.why:a.s.pros.slice(0,3)).map(t=>`<li>${t}</li>`).join("")}</ul></div>
      <div><h3>Heads-up from reviews</h3><ul class="heads">${relCons(a)}</ul></div>
     </div>
     ${S.width==="wide"&&a.s.wide&&a.s.fit!=="roomy"?`<div class="note">Order the wide (2E men’s / D women’s) version.</div>`:""}
     ${a.s.cat==="race"?`<div class="note">This is a race-day shoe. Pair it with a durable daily trainer for most of your miles.</div>`:""}
    </div>
   </article>

   <h2 class="section-h">Also on the podium</h2>
   <div class="alts">${[b,c].map(r=>`<div class="alt"><div class="row"><div><div class="brand">${r.s.brand} · $${r.s.price}</div><h3>${r.s.model}</h3></div><div class="pct">${pc(r)}</div></div>${art(r.s,false)}
     <ul>${(r.why.length?r.why:r.s.pros).slice(0,2).map(t=>`<li>${t}</li>`).join("")}<li class="con">${r.heads[0]||r.s.cons[0]}</li></ul>${find(r.s)}</div>`).join("")}</div>

   ${partner?`<h2 class="section-h">${partner.s.cat==="race"?"Your race-day partner":"Add a training partner"}</h2><p class="section-p">${partner.s.cat==="race"?"You’re chasing faster times. Save a plated racer for workouts and race day so your main pair handles the daily miles.":"Your top pick is a racer. Put most of your miles on a tougher, more cushioned trainer like this and save the racer for when it counts."}</p>
    <div class="alts"><div class="alt"><div class="row"><div><div class="brand">${partner.s.brand} · $${partner.s.price}</div><h3>${partner.s.model}</h3></div><div class="pct">${pc(partner)}</div></div>${art(partner.s,false)}
    <ul>${partner.s.pros.slice(0,2).map(t=>`<li>${t}</li>`).join("")}<li class="con">${partner.s.cons[0]}</li></ul>${find(partner.s)}</div></div>`:""}

   ${blocked.length?`<h2 class="section-h">Left in the blocks</h2><p class="section-p">These would have made your top picks on specs alone, but owner and tester complaints line up with what matters to you.</p>
    ${blocked.map(r=>`<div class="blocked"><b>${r.s.brand} ${r.s.model}</b><p>${r.heads.slice(0,2).join(". ")}.</p></div>`).join("")}`:""}

   <h2 class="section-h">What you told us</h2><p class="section-p">Tap any answer to change it.</p>
   <div class="profile">${chips.map(([i,t])=>`<button data-act="goto" data-step="${i}">${esc(t)}</button>`).join("")}</div>

   <h2 class="section-h">The full field</h2><p class="section-p">All ${all.length} shoes, ranked for you. Your podium is outlined.</p>
   <div class="gallery">${all.map((r,i)=>`<div class="gcard${i<3?" podium":""}">${art(r.s,false)}<div class="gp">${r.pct}%</div><div class="gn">${r.s.brand} ${r.s.model}</div><div class="gm">${CATNAME[r.s.cat]} · $${r.s.price}</div>${find(r.s)}</div>`).join("")}</div>
   <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600;padding:6px 0">Compare specs in a table</summary>
   <div class="rank-wrap"><table class="rank"><thead><tr><th>Match</th><th>Shoe</th><th>Type</th><th>Price</th><th>Drop</th><th>Weight</th></tr></thead><tbody>
   ${all.map(r=>`<tr><td class="p">${r.pct}%</td><td>${r.s.brand} ${r.s.model}</td><td>${{daily:"Daily",max:"Max cushion",stab:"Stability",super:"Super trainer",tempo:"Tempo",race:"Racer",trail:"Trail",value:"Budget"}[r.s.cat]}</td><td>$${r.s.price}</td><td>${r.s.drop} mm</td><td>≈${r.s.wt} oz</td></tr>`).join("")}
   </tbody></table></div></details>

   <div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn bib" data-act="restart">Start over</button><button class="btn ghost" data-act="goto" data-step="0">Change my answers</button></div>

   <div class="foot">
    <p>Specs are approximate men’s figures; prices are typical full retail in USD and change often. Pros and cons summarise lab testing (RunRepeat, RTINGS), expert reviews (Doctors of Running, Runner’s World, Outside, iRunFar, GearJunkie, Marathon Handbook and others) and recurring owner complaints on retailer and review sites, current as of October 2026.</p>
    <p>Always try shoes on late in the day, with your running socks, and run in them before committing — most specialty stores and several brands offer trial returns. Persistent pain deserves a check-up with a sports physio or podiatrist.</p>
   </div>
  </section>`;
}

function render(focus){
  drawTrack();
  if(step<0) renderIntro(); else if(step>=STEPS.length) renderResults(); else renderStep();
  if(focus){ const h=document.getElementById("qh"); if(h){ h.focus({preventScroll:true}); window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); } }
}

/* =========================================================
   EVENTS
   ========================================================= */
const EXCLUSIVE={wear:["none","even"],pain:["none"]};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, key=t.dataset.key, val=t.dataset.val;
  if(act==="start"){ step=0; render(true); return; }
  if(act==="pick"){ S[key]=val; render(); return; }
  if(act==="toggle"){
    let arr=S[key]; const ex=EXCLUSIVE[key]||[];
    if(arr.includes(val)) arr=arr.filter(x=>x!==val);
    else { arr = ex.includes(val) ? [val] : arr.filter(x=>!ex.includes(x)).concat(val); }
    S[key]=arr; render(); return;
  }
  if(act==="unit"){
    if(S.unit!==val&&S.weight){ const w=parseFloat(S.weight); if(w) S.weight=String(Math.round(val==="kg"?w/2.2046:w*2.2046)); }
    S.unit=val; showErr=false; render(); return;
  }
  if(act==="noweight"){ S.noWeight=!S.noWeight; showErr=false; render(); return; }
  if(act==="next"){
    if(!STEPS[step].valid()){ showErr=true; render(); return; }
    showErr=false; step++; render(true); return;
  }
  if(act==="back"){ showErr=false; step=Math.max(-1,step-1); render(true); return; }
  if(act==="goto"){ step=+t.dataset.step; render(true); return; }
  if(act==="restart"){ S=blank(); step=-1; render(true); return; }
});
document.addEventListener("input",e=>{
  const t=e.target; const key=t.dataset&&t.dataset.key; if(!key) return;
  if(key==="miles"){ S.miles=+t.value; document.getElementById("milesOut").innerHTML=`${S.miles}<small>miles / ${Math.round(S.miles*1.609)} km</small>`; }
  else if(key==="budget"){ S.budget=+t.value; document.getElementById("budgetOut").textContent=`$${S.budget}${S.budget>=275?"+":""}`; }
  else if(key==="firm"){ S.firm=+t.value; document.getElementById("firmOut").textContent=["Pillow soft","Soft","Balanced","Firm-ish","Firm and fast"][S.firm-1]; }
  else if(key==="pace"){ S.pace=t.value; }
  else if(key==="weight"){ S.weight=t.value; const nb=document.querySelector('[data-act="next"]'); if(nb) nb.disabled=false; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".txt")){ const nb=document.querySelector('[data-act="next"]'); if(nb&&!nb.disabled) nb.click(); }
});
render();
</script>
</body>
</html>
